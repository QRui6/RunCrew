[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runcrew"
version = "0.1.0"
description = "Agent-native personal running operations system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "garmin-fit-sdk>=21.208,<22",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
runcrew = "runcrew.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runcrew"]

[tool.hatch.build.targets.wheel.force-include]
"src/runcrew/web/static" = "runcrew/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=data/private/pytest"
